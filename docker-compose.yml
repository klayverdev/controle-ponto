services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ponto
      POSTGRES_PASSWORD: ponto_dev
      POSTGRES_DB: ponto
    ports: ["127.0.0.1:5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
  app:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql://ponto:ponto_dev@db:5432/ponto?schema=public
    depends_on: [db]
    ports: ["127.0.0.1:3000:3000"]
volumes:
  pgdata:
