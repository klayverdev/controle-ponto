name: ci
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_USER: ponto, POSTGRES_PASSWORD: ponto, POSTGRES_DB: ponto_test }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ponto" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://ponto:ponto@localhost:5432/ponto_test?schema=public
      APP_ORIGIN: http://localhost:3000
      PIN_PEPPER: ci-pepper-ci-pepper-ci-pepper-ci-pepper
      SESSION_SECRET: ci-session-ci-session-ci-session-ci-session
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npx prisma generate
      - run: npm run lint
      - run: npm run typecheck
      - run: npx prisma migrate deploy
      - run: npm test
      - run: npm audit --omit=dev --audit-level=high
